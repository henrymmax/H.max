# Hmax - build do executavel no Azure DevOps
trigger:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

steps:
  - task: UsePythonVersion@0
    displayName: Python 3.12
    inputs:
      versionSpec: '3.12'

  - script: python tools/validar_dados.py launcher/dados.json
    displayName: Validar dados.json

  - script: python -m pip install --upgrade pip pyinstaller
    displayName: Instalar PyInstaller

  - powershell: |
      $ini = "[azure]`r`n"
      if ($env:DEVOPS_PAT -and $env:DEVOPS_PAT -ne '$(DEVOPS_PAT)') {
        $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":" + $env:DEVOPS_PAT))
        $url = "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.Name)/items?path=/launcher/dados.json&versionDescriptor.version=main&versionDescriptor.versionType=branch&`$format=text&api-version=7.1"
        $ini += "url=$url`r`nauth=Basic $b64`r`n"
        Write-Host "App sera gerado lendo o banco do Azure DevOps."
      } else {
        $ini += "url=`r`n"
        Write-Host "DEVOPS_PAT nao definido: o app continuara lendo do Gist."
      }
      Set-Content -Path launcher/fonte_banco.ini -Value $ini -Encoding ASCII
    displayName: Configurar fonte do banco
    env:
      DEVOPS_PAT: $(DEVOPS_PAT)

  - script: >
      python -m PyInstaller --noconfirm --clean --onefile --noconsole --name Hmax
      --icon "Hmaxlogo.ico"
      --add-data "F1_LS_3_1_0.ahk;."
      --add-data "Hmax_AutoUpdate.ahk;."
      --add-data "fonte_banco.ini;."
      --add-data "Pass64_original.exe;."
      --add-data "Pass32.exe;."
      --add-data "Hmaxlogo.ico;."
      --add-data "Hmaxlogo.png;."
      --add-data "UX;UX"
      hmax_launcher.py
    workingDirectory: launcher
    displayName: Gerar Hmax.exe

  - task: PublishPipelineArtifact@1
    displayName: Publicar executavel
    inputs:
      targetPath: launcher/dist/Hmax.exe
      artifact: Hmax-exe
